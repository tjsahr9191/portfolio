# ECR Pull Secret for k3s
# This CronJob automatically refreshes ECR credentials every 6 hours
# Required because ECR tokens expire after 12 hours

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-credentials-helper
  namespace: portfolio

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-credentials-helper
  namespace: portfolio
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-credentials-helper
  namespace: portfolio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-credentials-helper
subjects:
  - kind: ServiceAccount
    name: ecr-credentials-helper
    namespace: portfolio

---
# Initial secret creation (will be refreshed by CronJob)
# Run this manually first:
# aws ecr get-login-password --region <region> | kubectl create secret docker-registry ecr-registry-secret \
#   --docker-server=<account-id>.dkr.ecr.<region>.amazonaws.com \
#   --docker-username=AWS \
#   --docker-password-stdin \
#   -n portfolio

apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-credentials-refresh
  namespace: portfolio
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-credentials-helper
          restartPolicy: OnFailure
          containers:
            - name: ecr-credentials-helper
              # Use AWS CLI image
              image: amazon/aws-cli:latest
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: aws-secret-access-key
                - name: AWS_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: portfolio-config
                      key: AWS_REGION
                - name: ECR_REGISTRY
                  valueFrom:
                    configMapKeyRef:
                      name: portfolio-config
                      key: ECR_REGISTRY
              command:
                - /bin/sh
                - -c
                - |
                  # Install kubectl
                  ARCH="amd64"
                  if [ "$(uname -m)" = "aarch64" ]; then ARCH="arm64"; fi
                  curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/${ARCH}/kubectl"
                  chmod +x kubectl
                  mv kubectl /usr/local/bin/
                  
                  # Get ECR token
                  TOKEN=$(aws ecr get-login-password --region $AWS_REGION)
                  
                  # Delete old secret if exists
                  kubectl delete secret ecr-registry-secret -n portfolio --ignore-not-found
                  
                  # Create new secret
                  kubectl create secret docker-registry ecr-registry-secret \
                    --docker-server=$ECR_REGISTRY \
                    --docker-username=AWS \
                    --docker-password=$TOKEN \
                    -n portfolio

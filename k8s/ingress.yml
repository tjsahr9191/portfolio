# Ingress Configuration for k3s with Traefik + HTTPS
# Domain: numkyelee.store

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
  annotations:
    # Traefik annotations
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # cert-manager annotation for automatic certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Redirect HTTP to HTTPS
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - numkyelee.store
        - www.numkyelee.store
      secretName: portfolio-tls
  rules:
    - host: numkyelee.store
      http:
        paths:
          # API routes -> Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: portfolio-backend
                port:
                  number: 8080
          # Actuator endpoints -> Backend
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: portfolio-backend
                port:
                  number: 8080
          # All other routes -> Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-frontend
                port:
                  number: 3000
    # www subdomain redirect to main domain
    - host: www.numkyelee.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-frontend
                port:
                  number: 3000

---
# Middleware for HTTP to HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true

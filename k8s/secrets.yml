# IMPORTANT: This is a template file.
# DO NOT commit real secrets to git!
# 
# Production Usage Options:
# 1. Create secrets manually: kubectl create secret generic portfolio-secrets \
#    --from-literal=DB_HOST=your-rds-endpoint \
#    --from-literal=DB_USERNAME=your-username \
#    --from-literal=DB_PASSWORD=your-password \
#    -n portfolio
#
# 2. Use sealed-secrets or external-secrets for GitOps
#
# 3. Use AWS Secrets Manager with External Secrets Operator

apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
type: Opaque
stringData:
  # Replace with your actual RDS endpoint
  DB_HOST: "your-rds-endpoint.rds.amazonaws.com"
  DB_USERNAME: "portfolio"
  # Base64 encoded in real usage, here in plain text for template
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

---
# AWS Credentials for ECR authentication
# Create manually or use external-secrets
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
type: Opaque
stringData:
  aws-access-key-id: "YOUR_AWS_ACCESS_KEY_ID"
  aws-secret-access-key: "YOUR_AWS_SECRET_ACCESS_KEY"
